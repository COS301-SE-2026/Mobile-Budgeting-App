  uri: !env PS_URI
  sslmode: !env PS_SSLMODE

port: 8080

sync_config:
  path: sync-rules.yaml

client_auth:
  jwks_uri:  !env PS_COGNITO_JWKS_URI
  audience:
    - !env PS_COGNITO_APP_CLIENT_ID
