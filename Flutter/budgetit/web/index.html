<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #05230f; }
    #startup-splash {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      background: #05230f;
    }
    #startup-splash img { max-width: min(85vw, 560px); max-height: 85vh; object-fit: contain; }
    #startup-loading { color: #ddd6ae; font: 18px sans-serif; }
  </style>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="budgetit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>budgetit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup-splash" role="status" aria-label="Budgetit is loading">
    <img src="splash_logo.png" alt="Budget IT — Make every rand count">
    <span id="startup-loading" hidden>Loading Budgetit…</span>
  </div>
  <script>
    window.budgetitSplashDelay = new Promise((resolve) => {
      setTimeout(() => {
        document.querySelector('#startup-splash img').hidden = true;
        document.getElementById('startup-loading').hidden = false;
        resolve();
      }, 3000);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
