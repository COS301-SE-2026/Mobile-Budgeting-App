appId: com.example.budgetit
name: Add Manual Expense and Income Transactions
tags:
  - transactions
---
# Expects the app to already be on the dashboard.

- copyTextFrom:
    text: "R[0-9,.]+"
    index: 0
- evalScript: '${output.initialDaily = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "Monthly total: R[0-9,.]+"
- evalScript: '${output.initialMonthly = parseFloat(maestro.copiedText.replace("Monthly total: R", "").replaceAll(",", ""))}'

- tapOn: "VIEW HEALTH ANALYSIS"
- assertVisible: "Financial Health Analysis"
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Income"
- evalScript: '${output.initialIncome = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Expenses"
- evalScript: '${output.initialExpenses = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Net Balance"
- evalScript: '${output.initialNetBalance = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "[0-9,.]+%"
    rightOf:
      text: "Budget Usage"
- evalScript: '${output.initialBudgetUsage = parseFloat(maestro.copiedText.replace("%", "").replaceAll(",", ""))}'
- tapOn: "CLOSE"
- tapOn: "Tab 2 of 3"

- tapOn:
    point: 956,2000
- tapOn: "Add Transaction"
- assertVisible: "Add Transaction"
- tapOn: "Expense"
- tapOn: "e.g. Grocery run"
- inputText: "Manual expense"
- tapOn: "0.00"
- inputText: "123.45"
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Manual expense.*"
    timeout: 5000
- assertVisible: "Manual expense.*"

- tapOn:
    point: 956,2000
- tapOn: "Add Transaction"
- assertVisible: "Add Transaction"
- tapOn: "Income"
- tapOn: "e.g. Grocery run"
- inputText: "Manual income"
- tapOn: "0.00"
- inputText: "456.78"
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Manual income.*"
    timeout: 5000
- assertVisible: "Manual income.*"

- tapOn: "Income"
- extendedWaitUntil:
    visible: "Manual income.*"
    timeout: 5000
- assertVisible: "Manual income.*"

- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "Manual expense.*"
    timeout: 5000
- assertVisible: "Manual expense.*"

- tapOn: "Tab 1 of 3"
- extendedWaitUntil:
    visible: "R[0-9,.]+"
    timeout: 5000
- copyTextFrom:
    text: "R[0-9,.]+"
    index: 0
- evalScript: '${output.finalDaily = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "Monthly total: R[0-9,.]+"
- evalScript: '${output.finalMonthly = parseFloat(maestro.copiedText.replace("Monthly total: R", "").replaceAll(",", ""))}'
- assertTrue: ${Math.abs(output.finalDaily - output.initialDaily - 123.45) < 0.01}
- assertTrue: ${output.finalMonthly > output.initialMonthly}

- scrollUntilVisible:
    element: "VIEW HEALTH ANALYSIS"
    direction: UP
    timeout: 5000
- tapOn: "VIEW HEALTH ANALYSIS"
- assertVisible: "Financial Health Analysis"
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Income"
- evalScript: '${output.finalIncome = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Expenses"
- evalScript: '${output.finalExpenses = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "R[0-9,.]+"
    rightOf:
      text: "Net Balance"
- evalScript: '${output.finalNetBalance = parseFloat(maestro.copiedText.replace("R", "").replaceAll(",", ""))}'
- copyTextFrom:
    text: "[0-9,.]+%"
    rightOf:
      text: "Budget Usage"
- evalScript: '${output.finalBudgetUsage = parseFloat(maestro.copiedText.replace("%", "").replaceAll(",", ""))}'
- assertTrue: ${output.finalIncome > output.initialIncome}
- assertTrue: ${output.finalExpenses > output.initialExpenses}
- assertTrue: ${output.finalNetBalance > output.initialNetBalance}
- assertTrue: ${output.finalBudgetUsage > output.initialBudgetUsage}
- tapOn: "CLOSE"

- scrollUntilVisible:
    element: "RECENT TRANSACTIONS"
    direction: DOWN
    timeout: 5000
- scrollUntilVisible:
    element: "Manual income.*"
    direction: DOWN
    timeout: 5000
- assertVisible: "Manual income.*"
- assertVisible: "Manual expense.*"
