appId: com.example.budgetit
name: Add Manual Expense and Income Transactions
tags:
  - transactions
---
# Expects the app to already be on the dashboard.
- tapOn: "Tab 2 of 3"

- tapOn:
    point: 956,2000
- tapOn: "Add Transaction"
- assertVisible: "Add Transaction"
- tapOn: "Expense"
- tapOn: "e.g. Grocery run"
- inputText: "Manual expense"
- tapOn: "0.00"
- inputText: "123.45"
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Manual expense.*"
    timeout: 5000
- assertVisible: "Manual expense.*"

- tapOn:
    point: 956,2000
- tapOn: "Add Transaction"
- assertVisible: "Add Transaction"
- tapOn: "Income"
- tapOn: "e.g. Grocery run"
- inputText: "Manual income"
- tapOn: "0.00"
- inputText: "456.78"
- hideKeyboard
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Manual income.*"
    timeout: 5000
- assertVisible: "Manual income.*"

- tapOn: "Income"
- extendedWaitUntil:
    visible: "Manual income.*"
    timeout: 5000
- assertVisible: "Manual income.*"

- tapOn: "Expenses"
- extendedWaitUntil:
    visible: "Manual expense.*"
    timeout: 5000
- assertVisible: "Manual expense.*"
