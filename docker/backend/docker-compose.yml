services:
  backend-api:
    build:
      context: ../..
      dockerfile: docker/backend/Dockerfile
      args:
        - PYTHON_IMAGE=${PYTHON_IMAGE:-python:3.12-slim}
        - APP_HOST=${APP_HOST:-0.0.0.0}
        - APP_PORT=${APP_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - ../../backend/src:/app/src
    env_file:
      - ../../backend/.env
    networks:
      - budgetit-net

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=adminuser
      - MINIO_ROOT_PASSWORD=adminpassword
    networks:
      - budgetit-net
    restart: always

  createbuckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    networks:
      - budgetit-net
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set localminio http://minio:9000 adminuser adminpassword;
      /usr/bin/mc mb localminio/apk-bucket;
      exit 0;
      "

  db:
    image: postgres:latest
    container_name: my-postgres-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - budgetit-net

  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ../../powersync/config.yaml:/config/config.yaml
      - ../../powersync/sync-rules.yaml:/config/sync-rules.yaml
    ports:
      - "8080:8080"
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    networks:
      - budgetit-net

volumes:
  minio-data:
  pgdata:

networks:
  budgetit-net:
    name: ${NETWORK_NAME:-budgetit-net}