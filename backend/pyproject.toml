[project]
name = "budgetit-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138",
    "jwt>=1.4.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.52",
    "typing>=3.10.0.0",
    "uvicorn[standard]>=0.49",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
