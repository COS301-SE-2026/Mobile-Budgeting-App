name: Dev CI

on:
  push:
    branches:
      - dev
      - newdev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Flutter/budgetit/**/*.g.dart"
      - "Flutter/budgetit/**/*.freezed.dart"
  pull_request:
    branches:
      - dev
      - newdev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Flutter/budgetit/**/*.g.dart"
      - "Flutter/budgetit/**/*.freezed.dart"

concurrency:
  group: ci-dev-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-slim
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
      - name: Upload SARIF to GitHub Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  prepare:
    name: Prepare
    runs-on: self-hosted
    outputs:
      has_integration_tests: ${{ steps.detect-tests.outputs.has_integration_tests }}
      has_sonar: ${{ steps.check-sonar.outputs.has_sonar }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Detect unimplemented integration tests
        id: detect-tests
        working-directory: Flutter/budgetit
        run: |
          has() { grep -rqlE 'testWidgets|test\(' "$1" 2>/dev/null && echo true || echo false; }
          echo "has_integration_tests=$(has test/integration)" >> "$GITHUB_OUTPUT"

      - name: Check SonarCloud secrets
        id: check-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "has_sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sonar=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/flutter-setup

      - name: Cache build_runner outputs
        id: build-runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Flutter/budgetit/.dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-${{ hashFiles('Flutter/budgetit/lib/**/*.dart', 'Flutter/budgetit/test/**/*.dart', '!Flutter/budgetit/lib/**/*.g.dart', '!Flutter/budgetit/lib/**/*.freezed.dart', '!Flutter/budgetit/test/**/*.g.dart', '!Flutter/budgetit/test/**/*.freezed.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-
            build-runner-${{ runner.os }}-

      - name: Dart Build Runner
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
        working-directory: Flutter/budgetit
        run: dart run build_runner build --delete-conflicting-outputs

  dart-format:
    name: Dart Format
    needs: prepare
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/flutter-setup

      - name: Cache build_runner outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Flutter/budgetit/.dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-${{ hashFiles('Flutter/budgetit/lib/**/*.dart', 'Flutter/budgetit/test/**/*.dart', '!Flutter/budgetit/lib/**/*.g.dart', '!Flutter/budgetit/lib/**/*.freezed.dart', '!Flutter/budgetit/test/**/*.g.dart', '!Flutter/budgetit/test/**/*.freezed.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-
            build-runner-${{ runner.os }}-

      - uses: ./.github/actions/memoized-step
        continue-on-error: true
        with:
          check-name: dart-format
          working-directory: Flutter/budgetit
          command: dart format --output=none --set-exit-if-changed .

  flutter-analyze:
    name: Flutter Analyze
    needs: prepare
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/flutter-setup

      - name: Cache build_runner outputs
        id: build-runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Flutter/budgetit/.dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-${{ hashFiles('Flutter/budgetit/lib/**/*.dart', 'Flutter/budgetit/test/**/*.dart', '!Flutter/budgetit/lib/**/*.g.dart', '!Flutter/budgetit/lib/**/*.freezed.dart', '!Flutter/budgetit/test/**/*.g.dart', '!Flutter/budgetit/test/**/*.freezed.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-
            build-runner-${{ runner.os }}-

      - name: Dart Build Runner
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
        working-directory: Flutter/budgetit
        run: dart run build_runner build --delete-conflicting-outputs

      - uses: ./.github/actions/memoized-step
        continue-on-error: true
        with:
          check-name: flutter-analyze
          working-directory: Flutter/budgetit
          command: flutter analyze

  unit-tests:
    name: Unit Tests
    needs: prepare
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: ./.github/actions/flutter-setup

      - name: Cache build_runner outputs
        id: build-runner-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Flutter/budgetit/.dart_tool/build
          key: build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-${{ hashFiles('Flutter/budgetit/lib/**/*.dart', 'Flutter/budgetit/test/**/*.dart', '!Flutter/budgetit/lib/**/*.g.dart', '!Flutter/budgetit/lib/**/*.freezed.dart', '!Flutter/budgetit/test/**/*.g.dart', '!Flutter/budgetit/test/**/*.freezed.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}-
            build-runner-${{ runner.os }}-

      - name: Dart Build Runner
        if: steps.build-runner-cache.outputs.cache-hit != 'true'
        working-directory: Flutter/budgetit
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Unit tests
        working-directory: Flutter/budgetit
        run: |
          flutter test --coverage --concurrency=4 $(find test -name '*_test.dart' -not -path 'test/golden/*' -not -path 'test/performance/*' -not -path 'test/integration/*')

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-lcov
          path: Flutter/budgetit/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: Flutter/budgetit/coverage/lcov.info
          fail_ci_if_error: true

  sonarcloud:
    name: SonarCloud
    runs-on: self-hosted
    needs: [prepare, unit-tests]
    if: needs.prepare.outputs.has_sonar == 'true'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-lcov
          path: Flutter/budgetit/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: self-hosted
    needs: prepare
    if: needs.prepare.outputs.has_integration_tests == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/flutter-setup
      - name: Integration Tests
        working-directory: Flutter/budgetit
        run: flutter test test/integration/
