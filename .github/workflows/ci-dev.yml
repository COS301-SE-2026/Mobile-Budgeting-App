name: Dev CI

on:
  push:
    branches:
      - dev
      - newdev
    tags:
      - "ci-dev-test-*"
  pull_request:
    branches:
      - dev
      - newdev
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all dev checks, ignoring changed paths
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-dev-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/change-detection.yml
    with:
      force_full: ${{ startsWith(github.ref, 'refs/tags/ci-dev-test-') || inputs.force_full || false }}

  osv-scan:
    name: OSV Scan
    needs: changes
    if: needs.changes.outputs.should_osv_scan == 'true'
    uses: ./.github/workflows/osv-scan.yml
    with:
      blocking: true

  prepare:
    name: Generate Dart
    needs: changes
    if: needs.changes.outputs.should_prepare_generated_dart == 'true'
    uses: ./.github/workflows/generated-dart.yml

  lint:
    name: Lint
    needs: [changes, prepare]
    if: needs.changes.outputs.should_lint == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  unit-tests:
    name: Unit Tests
    needs: [changes, prepare]
    if: needs.changes.outputs.should_unit_tests == 'true'
    uses: ./.github/workflows/unit-tests.yml
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  widget-tests:
    name: Widget Tests
    needs: [changes, prepare]
    if: needs.changes.outputs.should_widget_tests == 'true'
    uses: ./.github/workflows/widget-tests.yml
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  integration-tests:
    name: Integration Tests
    needs: [changes, prepare]
    if: needs.changes.outputs.should_integration_tests == 'true'
    uses: ./.github/workflows/integration-tests.yml
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  report-unit-tests:
    name: Unit Test Report
    needs: unit-tests
    if: always() && needs.unit-tests.result != 'skipped' && needs.unit-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    with:
      report-artifact: ${{ needs.unit-tests.outputs.report-artifact }}
      report-path: unit.json
      report-name: Unit Tests
      blocking: true

  report-widget-tests:
    name: Widget Test Report
    needs: widget-tests
    if: always() && needs.widget-tests.result != 'skipped' && needs.widget-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    with:
      report-artifact: ${{ needs.widget-tests.outputs.report-artifact }}
      report-path: widget.json
      report-name: Widget Tests
      blocking: true

  report-integration-tests:
    name: Integration Test Report
    needs: integration-tests
    if: always() && needs.integration-tests.result != 'skipped' && needs.integration-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    with:
      report-artifact: ${{ needs.integration-tests.outputs.report-artifact }}
      report-path: integration.json
      report-name: Integration Tests
      blocking: true

  coverage-gate:
    name: Coverage
    needs: [prepare, unit-tests, widget-tests]
    if: >-
      ${{
        always() &&
        needs.unit-tests.result != 'skipped' &&
        needs.unit-tests.result != 'cancelled' &&
        needs.widget-tests.result != 'skipped' &&
        needs.widget-tests.result != 'cancelled'
      }}
    uses: ./.github/workflows/coverage-gate.yml
    with:
      blocking: true
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      unit-coverage-artifact: ${{ needs.unit-tests.outputs.coverage-artifact }}
      widget-coverage-artifact: ${{ needs.widget-tests.outputs.coverage-artifact }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
