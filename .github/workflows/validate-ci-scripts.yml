name: Validate CI Scripts

on:
  push:
    paths:
      - ".github/CI-scripts/**"
  pull_request:
    paths:
      - ".github/CI-scripts/**"
  workflow_dispatch:

jobs:
  validate:
    name: Validate CI scripts
    runs-on: ubuntu-latest
    env:
      CI_SCRIPTS_DIR: .github/CI-scripts
      CI_SCRIPT_GLOB: "*.sh"
      CI_SHEBANG_PREFIX: '#!'
      CI_SHELLCHECK_COMMAND: shellcheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Validate shell syntax and permissions
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ci_scripts=("${CI_SCRIPTS_DIR}"/${CI_SCRIPT_GLOB})

          if [ "${#ci_scripts[@]}" -eq 0 ]; then
            echo "No CI scripts were found under ${CI_SCRIPTS_DIR}"
            exit 1
          fi

          for script_path in "${ci_scripts[@]}"; do
            if [ ! -f "$script_path" ]; then
              echo "CI Script: $script_path is Missing"
              exit 1
            fi


            if [ ! -x "$script_path" ]; then
              echo "Script is not set as executable: $script_path"
              exit 1
            fi


            first_line=$(sed -n '1p' "$script_path")
            if [[ "$first_line" != "${CI_SHEBANG_PREFIX}"* ]]; then
              echo "Shebang in CI script: $script_path is missing"
              exit 1
            fi

            bash -n "$script_path"
          done

      - name: Run ShellCheck when available
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v "$CI_SHELLCHECK_COMMAND" >/dev/null 2>&1; then
            echo "${CI_SHELLCHECK_COMMAND} is not available : skipping"
            exit 0
          fi

          "$CI_SHELLCHECK_COMMAND" "${CI_SCRIPTS_DIR}"/*.sh
