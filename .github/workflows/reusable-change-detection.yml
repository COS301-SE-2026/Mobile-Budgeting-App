name: Reusable Change Detection

on:
  workflow_call:
    outputs:
      flutter_app_changed:
        description: Whether non-generated Flutter application files changed
        value: ${{ jobs.detect.outputs.flutter_app_changed }}
      flutter_landing_changed:
        description: Whether landing-page files changed
        value: ${{ jobs.detect.outputs.flutter_landing_changed }}
      flutter_generated_changed:
        description: Whether generated Dart files changed
        value: ${{ jobs.detect.outputs.flutter_generated_changed }}
      flutter_shared_changed:
        description: Whether shared Flutter files changed
        value: ${{ jobs.detect.outputs.flutter_shared_changed }}
      flutter_config_changed:
        description: Whether Flutter dependency or configuration files changed
        value: ${{ jobs.detect.outputs.flutter_config_changed }}
      backend_changed:
        description: Whether backend files changed
        value: ${{ jobs.detect.outputs.backend_changed }}
      ci_shared_changed:
        description: Whether CI or repository build files changed
        value: ${{ jobs.detect.outputs.ci_shared_changed }}
      security_global_changed:
        description: Whether security policy files changed
        value: ${{ jobs.detect.outputs.security_global_changed }}
      documentation_changed:
        description: Whether documentation files changed
        value: ${{ jobs.detect.outputs.documentation_changed }}
      unknown_changed:
        description: Whether an unclassified path changed
        value: ${{ jobs.detect.outputs.unknown_changed }}

jobs:
  detect:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      flutter_app_changed: ${{ steps.filter.outputs.flutter_app }}
      flutter_landing_changed: ${{ steps.filter.outputs.flutter_landing }}
      flutter_generated_changed: ${{ steps.filter.outputs.flutter_generated }}
      flutter_shared_changed: ${{ steps.filter.outputs.flutter_shared }}
      flutter_config_changed: ${{ steps.filter.outputs.flutter_config }}
      backend_changed: ${{ steps.filter.outputs.backend }}
      ci_shared_changed: ${{ steps.filter.outputs.ci_shared }}
      security_global_changed: ${{ steps.filter.outputs.security_global }}
      documentation_changed: ${{ steps.filter.outputs.documentation }}
      unknown_changed: ${{ steps.filter.outputs.unknown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        with:
          filters: .github/ci-path-filters.yml
          token: ${{ github.token }}
