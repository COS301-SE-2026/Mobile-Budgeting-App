name: APK Build

on:
  workflow_call:
    inputs:
      blocking:
        description: Fail the workflow when the APK build fails
        required: false
        default: true
        type: boolean
      generated-artifact:
        description: Generated Dart artifact name
        required: true
        type: string
      source-ref:
        description: Source ref to build
        required: true
        type: string
    outputs:
      artifact-name:
        description: Uploaded release APK artifact name
        value: ${{ jobs.build.outputs.artifact-name }}
      source-sha:
        description: Source SHA for the APK artifact
        value: ${{ jobs.build.outputs.source-sha }}

jobs:
  build:
    name: Build APK
    runs-on:
      - self-hosted
      - linux
      - flutter-3.47.1
      - android-ndk-28.2.13676358
    continue-on-error: ${{ !inputs.blocking }}
    env:
      PROD_API_URL: https://api.16.28.126.118.sslip.io
      PROD_POWERSYNC_URL: https://sync.16.28.126.118.sslip.io
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-name: ${{ steps.source.outputs.artifact-name }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref }}

      - name: Get source commit
        id: source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source-sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "artifact-name=apk-${source_sha}-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter
        uses: ./.github/actions/flutter-ci-setup

      - name: Download generated Dart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.generated-artifact }}
          path: Flutter/budgetit

      - name: Check APK toolchain
        shell: bash
        env:
          EXPECTED_JAVA_MAJOR: '17'
          EXPECTED_GRADLE_VERSION: '9.1.0'
          EXPECTED_AGP_VERSION: '8.12.1'
          EXPECTED_KOTLIN_VERSION: '2.2.20'
          EXPECTED_NDK_VERSION: '28.2.13676358'
        run: |
          set -euo pipefail
          source .github/CI-scripts/ci-common.sh
          ci_require_cmd java sed

          check_version() {
            local name="$1" actual="$2" expected="$3"
            echo "$name: ${actual:-unknown}"
            if [ "$actual" != "$expected" ]; then
              echo "Expected $name $expected, found ${actual:-unknown}." >&2
              exit 1
            fi
          }

          java_version=$(java -version 2>&1 | ci_first_match_in_text '^.*version "\([0-9][0-9._-]*\)".*$')
          check_version Java "${java_version%%.*}" "$EXPECTED_JAVA_MAJOR"

          android_dir=Flutter/budgetit/android
          settings_file="$android_dir/settings.gradle.kts"
          agp_version=$(ci_first_match_in_text '.*id("com.android.application")[[:space:]]*version[[:space:]]*"\([^"]*\)".*' < "$settings_file")
          kotlin_version=$(ci_first_match_in_text '.*id("org.jetbrains.kotlin.android")[[:space:]]*version[[:space:]]*"\([^"]*\)".*' < "$settings_file")
          check_version 'Android Gradle Plugin' "$agp_version" "$EXPECTED_AGP_VERSION"
          check_version 'Kotlin Gradle Plugin' "$kotlin_version" "$EXPECTED_KOTLIN_VERSION"

          # Flutter generates the ignored wrapper launcher during the build.
          # Check its tracked distribution instead of requiring ./gradlew here.
          gradle_version=$(ci_first_match_in_text '^distributionUrl=.*gradle-\([0-9][0-9.]*\)-.*\.zip.*$' < "$android_dir/gradle/wrapper/gradle-wrapper.properties")
          check_version 'Gradle wrapper' "$gradle_version" "$EXPECTED_GRADLE_VERSION"

          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/ndk/$EXPECTED_NDK_VERSION" ]; then
            echo "Android SDK with NDK $EXPECTED_NDK_VERSION is required." >&2
            exit 1
          fi

      - name: Apply Gradle settings
        shell: bash
        run: cp .github/gradle/ci-gradle.properties Flutter/budgetit/android/gradle.properties

      - name: Check production endpoints
        shell: bash
        run: |
          set -euo pipefail

          for endpoint in "$PROD_API_URL" "$PROD_POWERSYNC_URL"; do
            case "$endpoint" in
              https://*) ;;
              *)
                echo "Production endpoint must use HTTPS: $endpoint" >&2
                exit 1
                ;;
            esac

            case "$endpoint" in
              *10.0.2.2*|*localhost*|*127.0.0.1*)
                echo "Production endpoint points to a local address: $endpoint" >&2
                exit 1
                ;;
            esac
          done

      - name: Build release APK
        working-directory: Flutter/budgetit
        run: |
          set -euo pipefail
          api_url="${PROD_API_URL%/}"
          powersync_url="${PROD_POWERSYNC_URL%/}"

          flutter build apk --release --no-tree-shake-icons \
            --dart-define=ENVIRONMENT=prod \
            --dart-define=POWERSYNC_URL="$powersync_url" \
            --dart-define=API_URL="$api_url"

      - name: Check release APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path='Flutter/budgetit/build/app/outputs/flutter-apk/app-release.apk'

          if [ ! -f "$apk_path" ]; then
            echo "Release APK was not created at $apk_path." >&2
            exit 1
          fi

          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          if [ -z "$sdk_root" ]; then
            echo 'ANDROID_SDK_ROOT or ANDROID_HOME is required.' >&2
            exit 1
          fi

          aapt_path=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          if [ -z "$aapt_path" ]; then
            echo 'Unable to find aapt in the Android SDK.' >&2
            exit 1
          fi

          permissions=$($aapt_path dump permissions "$apk_path")
          printf '%s\n' "$permissions"
          if ! grep -q 'android.permission.INTERNET' <<< "$permissions"; then
            echo 'Release APK is missing android.permission.INTERNET.' >&2
            exit 1
          fi

          badging=$($aapt_path dump badging "$apk_path")
          if grep -q 'application-debuggable' <<< "$badging"; then
            echo 'Expected a non-debuggable release APK.' >&2
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.source.outputs.artifact-name }}
          path: Flutter/budgetit/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
