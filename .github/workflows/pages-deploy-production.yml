name: Pages Production Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Build artifact from the current workflow run
        required: true
        type: string

permissions: {}

jobs:
  validate-inputs:
    name: Check Pages production inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check inputs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          if [ -z "$ARTIFACT_NAME" ]; then
            echo 'artifact-name is missing.' >&2
            exit 1
          fi

  deploy:
    name: Deploy Pages
    needs: validate-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e
        with:
          artifact_name: ${{ inputs.artifact-name }}
