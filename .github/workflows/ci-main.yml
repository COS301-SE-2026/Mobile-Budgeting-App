name: Main CI

on:
  push:
    branches:
      - main
    tags:
      - "ci-main-test-*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all main checks, ignoring changed paths
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-main-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/change-detection.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      force_full: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/ci-main-test-') || inputs.force_full || false }}

  secret-scan:
    name: Secret Scan
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true'
      }}
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
      security-events: write
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  osv-scan:
    name: OSV Scan
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_osv_scan == 'true'
      }}
    uses: ./.github/workflows/osv-scan.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      blocking: true
      source-ref: ''

  prepare:
    name: Generate Dart
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_prepare_generated_dart == 'true'
      }}
    uses: ./.github/workflows/generated-dart.yml
    permissions:
      contents: read
    with:
      source-ref: ''

  lint:
    name: Lint
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_lint == 'true'
      }}
    uses: ./.github/workflows/lint.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: false
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  unit-tests:
    name: Unit Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_unit_tests == 'true'
      }}
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: false
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  widget-tests:
    name: Widget Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_widget_tests == 'true'
      }}
    uses: ./.github/workflows/widget-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: false
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  integration-tests:
    name: Integration Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_integration_tests == 'true'
      }}
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: false
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  report-unit-tests:
    name: Unit Test Report
    needs: [prepare, unit-tests]
    if: always() && needs.unit-tests.result != 'skipped' && needs.unit-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.unit-tests.outputs.report-artifact }}
      report-path: unit.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Unit Tests
      blocking: false

  report-widget-tests:
    name: Widget Test Report
    needs: [prepare, widget-tests]
    if: always() && needs.widget-tests.result != 'skipped' && needs.widget-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.widget-tests.outputs.report-artifact }}
      report-path: widget.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Widget Tests
      blocking: false

  report-integration-tests:
    name: Integration Test Report
    needs: [prepare, integration-tests]
    if: always() && needs.integration-tests.result != 'skipped' && needs.integration-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.integration-tests.outputs.report-artifact }}
      report-path: integration.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Integration Tests
      blocking: false

  coverage-gate:
    name: Coverage
    needs: [prepare, unit-tests, widget-tests]
    if: >-
      ${{
        always() &&
        needs.unit-tests.result != 'skipped' &&
        needs.unit-tests.result != 'cancelled' &&
        needs.widget-tests.result != 'skipped' &&
        needs.widget-tests.result != 'cancelled'
      }}
    uses: ./.github/workflows/coverage-gate.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: false
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      unit-coverage-artifact: ${{ needs.unit-tests.outputs.coverage-artifact }}
      widget-coverage-artifact: ${{ needs.widget-tests.outputs.coverage-artifact }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  apk-build:
    name: Build APK
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_apk_build == 'true'
      }}
    uses: ./.github/workflows/apk-build.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  pages-build:
    name: Build Pages
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_pages_build == 'true'
      }}
    uses: ./.github/workflows/pages-build.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  deploy-apk-production:
    name: Deploy APK production
    needs:
      - secret-scan
      - osv-scan
      - apk-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/apk-deploy-production.yml
    permissions:
      actions: read
      contents: read
    concurrency:
      group: apk-production-release
      cancel-in-progress: false
    with:
      artifact-name: ${{ needs.apk-build.outputs.artifact-name }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-pages-production:
    name: Deploy Pages production
    needs:
      - secret-scan
      - osv-scan
      - pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages-deploy-production.yml
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production-release
      cancel-in-progress: false
    with:
      artifact-name: ${{ needs.pages-build.outputs.artifact-name }}
