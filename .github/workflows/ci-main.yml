name: Main CI

on:
  push:
    branches:
      - main
    tags:
      - "ci-main-test-*"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
  workflow_dispatch:
    inputs:
      force_full:
        description: Run all main checks, ignoring changed paths
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-main-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/change-detection.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      force_full: ${{ startsWith(github.ref, 'refs/tags/ci-main-test-') || inputs.force_full || false }}

  secret-scan:
    name: Secret Scan
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          )
        )
      }}
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
      security-events: write
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  osv-scan:
    name: OSV Scan
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_osv_scan == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          )
        )
      }}
    uses: ./.github/workflows/osv-scan.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      blocking: true
      source-ref: >-
        ${{
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          ) &&
          github.event.pull_request.head.sha || ''
        }}

  prepare:
    name: Generate Dart
    needs: changes
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_prepare_generated_dart == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          )
        )
      }}
    uses: ./.github/workflows/generated-dart.yml
    permissions:
      contents: read
    with:
      source-ref: >-
        ${{
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          ) &&
          github.event.pull_request.head.sha || ''
        }}

  lint:
    name: Lint
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_lint == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            contains(github.event.pull_request.labels.*.name, 'release-candidate') ||
            contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
          )
        )
      }}
    uses: ./.github/workflows/lint.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  unit-tests:
    name: Unit Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_unit_tests == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-candidate')
        )
      }}
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  widget-tests:
    name: Widget Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_widget_tests == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-candidate')
        )
      }}
    uses: ./.github/workflows/widget-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  integration-tests:
    name: Integration Tests
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_integration_tests == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-candidate')
        )
      }}
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  report-unit-tests:
    name: Unit Test Report
    needs: [prepare, unit-tests]
    if: always() && needs.unit-tests.result != 'skipped' && needs.unit-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.unit-tests.outputs.report-artifact }}
      report-path: unit.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Unit Tests
      blocking: true

  report-widget-tests:
    name: Widget Test Report
    needs: [prepare, widget-tests]
    if: always() && needs.widget-tests.result != 'skipped' && needs.widget-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.widget-tests.outputs.report-artifact }}
      report-path: widget.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Widget Tests
      blocking: true

  report-integration-tests:
    name: Integration Test Report
    needs: [prepare, integration-tests]
    if: always() && needs.integration-tests.result != 'skipped' && needs.integration-tests.result != 'cancelled'
    uses: ./.github/workflows/test-reporting.yml
    permissions:
      actions: read
      checks: write
      contents: read
    with:
      report-artifact: ${{ needs.integration-tests.outputs.report-artifact }}
      report-path: integration.json
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      report-name: Integration Tests
      blocking: true

  coverage-gate:
    name: Coverage
    needs: [prepare, unit-tests, widget-tests]
    if: >-
      ${{
        always() &&
        needs.unit-tests.result != 'skipped' &&
        needs.unit-tests.result != 'cancelled' &&
        needs.widget-tests.result != 'skipped' &&
        needs.widget-tests.result != 'cancelled'
      }}
    uses: ./.github/workflows/coverage-gate.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      source-ref: ${{ needs.prepare.outputs.source-sha }}
      unit-coverage-artifact: ${{ needs.unit-tests.outputs.coverage-artifact }}
      widget-coverage-artifact: ${{ needs.widget-tests.outputs.coverage-artifact }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  apk-build:
    name: Build APK
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_apk_build == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-candidate')
        )
      }}
    uses: ./.github/workflows/apk-build.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  pages-build:
    name: Build Pages
    needs: [changes, prepare]
    if: >-
      ${{
        needs.changes.outputs.force_full == 'true' ||
        needs.changes.outputs.should_pages_build == 'true' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
        )
      }}
    uses: ./.github/workflows/pages-build.yml
    permissions:
      actions: read
      contents: read
    with:
      blocking: true
      generated-artifact: ${{ needs.prepare.outputs.artifact-name }}
      source-ref: ${{ needs.prepare.outputs.source-sha }}

  publish-apk-candidate:
    name: Publish APK candidate
    needs:
      - secret-scan
      - osv-scan
      - lint
      - unit-tests
      - widget-tests
      - integration-tests
      - report-unit-tests
      - report-widget-tests
      - report-integration-tests
      - coverage-gate
      - apk-build
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'release-candidate')
      }}
    uses: ./.github/workflows/apk-deploy-candidate.yml
    permissions:
      contents: write
    with:
      artifact-name: ${{ needs.apk-build.outputs.artifact-name }}
      source-sha: ${{ github.event.pull_request.head.sha }}
      pull-request-number: ${{ format('{0}', github.event.pull_request.number) }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  publish-pages-candidate:
    name: Publish Pages candidate
    needs:
      - secret-scan
      - osv-scan
      - lint
      - pages-build
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'release-landing-candidate')
      }}
    uses: ./.github/workflows/pages-deploy-candidate.yml
    permissions:
      contents: write
    with:
      artifact-name: ${{ needs.pages-build.outputs.release-artifact-name }}
      source-sha: ${{ github.event.pull_request.head.sha }}
      pull-request-number: ${{ format('{0}', github.event.pull_request.number) }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
