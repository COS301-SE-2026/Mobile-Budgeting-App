name: Reusable Flutter Integration Tests

on:
  workflow_call:
    inputs:
      blocking:
        description: Whether integration-test failures fail this workflow
        required: false
        default: true
        type: boolean
      generated-artifact:
        description: Generated Dart artifact to download
        required: true
        type: string
      source-ref:
        description: Source ref to test
        required: true
        type: string
    outputs:
      report-artifact:
        description: Artifact containing the JSON integration test report
        value: ${{ jobs.integration-tests.outputs.report-artifact }}

jobs:
  integration-tests:
    name: Integration Tests
    runs-on:
      - self-hosted
      - linux
      - flutter-3.41.9
    continue-on-error: ${{ !inputs.blocking }}
    permissions:
      actions: read
      contents: read
    outputs:
      report-artifact: integration-test-report-${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref }}

      - name: Set up the provisioned Flutter SDK
        uses: ./.github/actions/flutter-ci-setup

      - name: Download generated Dart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.generated-artifact }}
          path: Flutter/budgetit

      - name: Run integration tests
        id: tests
        continue-on-error: true
        working-directory: Flutter/budgetit
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          flutter test --machine test/integration/ \
            > test-results/integration.json \
            2> >(tee test-results/integration.log >&2)
          status=$?
          echo "exit-code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Upload integration-test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-report-${{ github.run_id }}
          path: Flutter/budgetit/test-results/integration.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload integrationn test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-diagnostics-${{ github.run_id }}
          path: Flutter/budgetit/test-results/integration.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce blocking integration-test result
        if: ${{ always() && inputs.blocking && steps.tests.outcome != 'success' }}
        shell: bash
        run: |
          echo 'Integration test process failed.' >&2
          exit 1
