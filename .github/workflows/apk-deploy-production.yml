name: APK Production Deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Build artifact from the current workflow run
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

permissions: {}

jobs:
  validate-inputs:
    name: Check APK production inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check inputs
        shell: bash
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          if [ -z "$ARTIFACT_NAME" ]; then
            echo 'artifact-name is missing.' >&2
            exit 1
          fi

  deploy:
    name: Deploy APK
    needs: validate-inputs
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download built APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Check APK file
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apk_files < <(find dist -type f -name '*.apk' -print0)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "Expected one APK, found ${#apk_files[@]}." >&2
            exit 1
          fi

          printf 'APK_PATH=%s\n' "${apk_files[0]}" >> "$GITHUB_ENV"

      - name: Upload APK to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        run: |
          set -euo pipefail

          aws s3 cp "$APK_PATH" \
            s3://budgetit-apk-releases/apk-releases/latest.apk
