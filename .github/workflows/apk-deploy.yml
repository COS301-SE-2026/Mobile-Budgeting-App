name: APK Deploy

on:
  workflow_call:
    inputs:
      channel:
        description: Candidate or production
        required: true
        type: string
      artifact-name:
        description: APK artifact to publish as a candidate
        required: false
        type: string
      source-sha:
        description: Source commit
        required: true
        type: string
      pull-request-number:
        description: Candidate PR number
        required: false
        type: string
    secrets:
      RELEASE_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  validate-inputs:
    name: Check APK deploy inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail

          if [ -z "$SOURCE_SHA" ]; then
            echo 'source-sha is missing.' >&2
            exit 1
          fi

          case "$CHANNEL" in
            candidate)
              if [ -z "$ARTIFACT_NAME" ] || [ -z "$PR_NUMBER" ]; then
                echo 'Candidate requires artifact-name and pull-request-number.' >&2
                exit 1
              fi
              ;;
            production)
              if [ -n "$ARTIFACT_NAME" ] || [ -n "$PR_NUMBER" ]; then
                echo 'Production does not accept candidate inputs.' >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

  candidate:
    name: Publish APK candidate
    needs: validate-inputs
    if: inputs.channel == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - name: Check APK file
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apk_files < <(find dist -type f -name '*.apk' -print0)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "Expected one APK, found ${#apk_files[@]}." >&2
            exit 1
          fi

          printf 'APK_PATH=%s\n' "${apk_files[0]}" >> "$GITHUB_ENV"

      - name: Publish candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          CANDIDATE_TAG: candidate-apk-${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          candidate_notes=$(printf 'Candidate PR: #%s\nRelease candidate for source %s.' "$PR_NUMBER" "$SOURCE_SHA")

          if ! gh release view "$CANDIDATE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CANDIDATE_TAG" \
              --repo "$REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "BudgetIt APK $CANDIDATE_TAG" \
              --notes "$candidate_notes" \
              --prerelease \
              --latest=false
          fi

          gh release edit "$CANDIDATE_TAG" \
            --repo "$REPOSITORY" \
            --notes "$candidate_notes" \
            --prerelease \
            --latest=false

          gh release upload "$CANDIDATE_TAG" "$APK_PATH" \
            --repo "$REPOSITORY" \
            --clobber

  production:
    name: Deploy APK
    needs: validate-inputs
    if: inputs.channel == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Find candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/CI-scripts/validate-release-candidate.sh "${GITHUB_REF_NAME}" apk "${GITHUB_ENV}"

      - name: Download candidate APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "$CANDIDATE_RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern '*.apk' \
            --dir dist

      - name: Check APK file
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' apk_files < <(find dist -type f -name '*.apk' -print0)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "Expected one APK, found ${#apk_files[@]}." >&2
            exit 1
          fi

          printf 'APK_PATH=%s\n' "${apk_files[0]}" >> "$GITHUB_ENV"

      - name: Upload APK to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
        run: |
          set -euo pipefail

          aws s3 cp "$APK_PATH" \
            s3://budgetit-apk-releases/apk-releases/latest.apk
