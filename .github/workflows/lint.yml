name: Lint

on:
  workflow_call:
    inputs:
      blocking:
        description: Fail the workflow when lint fails
        required: false
        default: true
        type: boolean
      generated-artifact:
        description: Generated Dart artifact name
        required: true
        type: string
      source-ref:
        description: Source ref to lint
        required: true
        type: string

jobs:
  lint:
    name: Lint
    runs-on:
      - self-hosted
      - linux
      - flutter-3.41.9
    continue-on-error: ${{ !inputs.blocking }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref }}

      - name: Set up Flutter
        id: setup
        uses: ./.github/actions/flutter-ci-setup

      - name: Download generated Dart
        id: generated
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.generated-artifact }}
          path: Flutter/budgetit

      - name: Add analyzer annotations
        id: problem-matcher
        uses: leancodepl/dart-problem-matcher@db2c48534f89233ae58cb81a45ebc8fd21d90bff

      - name: Check formatting
        id: format
        continue-on-error: true
        working-directory: Flutter/budgetit
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        id: analyze
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.setup.outcome == 'success' && steps.generated.outcome == 'success' }}
        continue-on-error: true
        working-directory: Flutter/budgetit
        run: flutter analyze

      - name: Check lint result
        if: >-
          ${{
            always() &&
            (
              steps.checkout.outcome != 'success' ||
              steps.setup.outcome != 'success' ||
              steps.generated.outcome != 'success' ||
              steps.problem-matcher.outcome != 'success' ||
              steps.format.outcome != 'success' ||
              steps.analyze.outcome != 'success'
            )
          }}
        shell: bash
        run: |
          echo 'Lint checks failed.' >&2
          exit 1
