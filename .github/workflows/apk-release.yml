name: APK Release

on:
  push:
    tags:
      - "release-*"
      - "!release-landing-*"

concurrency:
  group: apk-production-release
  cancel-in-progress: false

permissions: {}

jobs:
  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read
      security-events: write
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deploy-apk-production:
    name: Deploy APK
    uses: ./.github/workflows/apk-deploy-production.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      source-sha: ${{ github.sha }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
