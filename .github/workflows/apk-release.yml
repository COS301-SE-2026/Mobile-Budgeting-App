name: APK Release

on:
  push:
    tags:
      - "release-*"
      - "!release-landing-*"

concurrency:
  group: apk-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write
  pages: write
  id-token: write

jobs:
  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  deploy-apk-production:
    name: Deploy APK
    needs: secret-scan
    uses: ./.github/workflows/apk-deploy.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write

    with:
      channel: production
      source-sha: ${{ github.sha }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
