name: Reusable OSV Dependency Scan

on:
  workflow_call:
    inputs:
      blocking:
        description: Whether OSV findings should fail this workflow
        required: false
        default: true
        type: boolean
      source-ref:
        description: Optional source ref for scanning instead of the event default ref
        required: false
        default: ''
        type: string

jobs:
  osv-scan:
    name: OSV Dependency Scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      upload-sarif: true
      fail-on-vuln: ${{ inputs.blocking }}
      ref: ${{ inputs.source-ref }}
      scan-args: |-
        -r
        --skip-git
        ./Flutter/budgetit
        ./backend
