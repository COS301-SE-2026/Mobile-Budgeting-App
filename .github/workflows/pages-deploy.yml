name: Pages Deploy

on:
  workflow_call:
    inputs:
      channel:
        description: Candidate or production
        required: true
        type: string
      artifact-name:
        description: Pages artifact to publish as a candidate
        required: false
        type: string
      source-sha:
        description: Source commit
        required: true
        type: string
      pull-request-number:
        description: Candidate PR number
        required: false
        type: string
    secrets:
      RELEASE_TOKEN:
        required: false

jobs:
  validate-inputs:
    name: Check Pages deploy inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check inputs
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          set -euo pipefail

          if [ -z "$SOURCE_SHA" ]; then
            echo 'source-sha is missing.' >&2
            exit 1
          fi

          case "$CHANNEL" in
            candidate)
              if [ -z "$ARTIFACT_NAME" ] || [ -z "$PR_NUMBER" ]; then
                echo 'Candidate requires artifact-name and pull-request-number.' >&2
                exit 1
              fi
              ;;
            production)
              if [ -n "$ARTIFACT_NAME" ] || [ -n "$PR_NUMBER" ]; then
                echo 'Production does not accept candidate inputs.' >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown channel: $CHANNEL" >&2
              exit 1
              ;;
          esac

  candidate:
    name: Publish Pages candidate
    needs: validate-inputs
    if: inputs.channel == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      - name: Package candidate
        shell: bash
        run: tar -czf pages-release-candidate.tar.gz -C site .

      - name: Publish candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          CANDIDATE_TAG: candidate-pages-${{ inputs.source-sha }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          candidate_notes=$(printf 'Candidate PR: #%s\nLanding-page release candidate for source %s.' "$PR_NUMBER" "$SOURCE_SHA")

          if ! gh release view "$CANDIDATE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CANDIDATE_TAG" \
              --repo "$REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "BudgetIt Pages $CANDIDATE_TAG" \
              --notes "$candidate_notes" \
              --prerelease \
              --latest=false
          fi

          gh release edit "$CANDIDATE_TAG" \
            --repo "$REPOSITORY" \
            --notes "$candidate_notes" \
            --prerelease \
            --latest=false

          gh release upload "$CANDIDATE_TAG" pages-release-candidate.tar.gz \
            --repo "$REPOSITORY" \
            --clobber

  production:
    name: Deploy Pages
    needs: validate-inputs
    if: inputs.channel == 'production'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Find candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/CI-scripts/validate-release-candidate.sh "${GITHUB_REF_NAME}" pages "${GITHUB_ENV}"

      - name: Download candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p site
          gh release download "$CANDIDATE_RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern 'pages-release-candidate.tar.gz' \
            --dir .
          tar -xzf pages-release-candidate.tar.gz -C site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e
