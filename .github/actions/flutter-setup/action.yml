name: Flutter Setup
description: Skip Flutter SDK install if already installed at the expected version; otherwise install via subosito, optionally set up Java, then run pub get.
inputs:
  needs-java:
    description: Whether to set up Java (needed for Android builds)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      if: inputs.needs-java == 'true'
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
      with:
        distribution: temurin
        java-version: 17

    - name: Check Flutter installation
      id: check
      shell: bash
      working-directory: Flutter/budgetit
      run: |
        if flutter --version 2>/dev/null | head -1 | grep -q '^Flutter 3.41.9'; then
          echo "skip_install=true" >> "${GITHUB_OUTPUT}"
        else
          echo "skip_install=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Install Flutter
      if: steps.check.outputs.skip_install != 'true'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d8f8c696479add0b2
      with:
        flutter-version: "3.41.9"

    - name: Install dependencies
      shell: bash
      working-directory: Flutter/budgetit
      run: flutter pub get
