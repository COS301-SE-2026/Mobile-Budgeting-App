name: Flutter Setup
description: Install Flutter using FVM with the version in .fvmrc, optionally set up Java, then run pub get.
inputs:
  needs-java:
    description: Whether to set up Java (needed for Android builds)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      if: inputs.needs-java == 'true'
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      with:
        distribution: temurin
        java-version: 17

    - name: Read version and check disk
      id: fvm
      shell: bash
      working-directory: Flutter/budgetit
      run: |
        version=$(grep -oP '"flutter"\s*:\s*"\K[^"]+' .fvmrc)
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        if [ -d "$HOME/fvm/versions/${version}" ]; then
          echo "on_disk=true" >> "${GITHUB_OUTPUT}"
        else
          echo "on_disk=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Restore FVM SDK from cache
      if: steps.fvm.outputs.on_disk != 'true'
      id: fvm-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/.fvmrc') }}

    - name: Install FVM
      shell: bash
      run: |
        if ! command -v fvm &> /dev/null; then
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "${GITHUB_PATH}"
        fi

    - name: Install Flutter SDK (via FVM)
      shell: bash
      working-directory: Flutter/budgetit
      run: fvm install

    - name: Save FVM SDK to cache
      if: steps.fvm.outputs.on_disk != 'true' && steps.fvm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/.fvmrc') }}

    - name: Configure PATH
      shell: bash
      working-directory: Flutter/budgetit
      run: echo "$(pwd)/.fvm/flutter_sdk/bin" >> "${GITHUB_PATH}"

    - name: Install dependencies
      shell: bash
      working-directory: Flutter/budgetit
      run: flutter pub get --enforce-lockfile
