name: Flutter Setup
description: Install Flutter using FVM with the version in .fvmrc, optionally set up Java, then run pub get.
inputs:
  needs-java:
    description: Whether to set up Java (needed for Android builds)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      if: inputs.needs-java == 'true'
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
      with:
        distribution: temurin
        java-version: 17

    - name: Cache FVM Flutter SDKs
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: ~/fvm/versions
        key: fvm-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/.fvmrc') }}
        restore-keys: |
          fvm-${{ runner.os }}-

    - name: Install FVM
      shell: bash
      run: |
        if ! command -v fvm &> /dev/null; then
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "${GITHUB_PATH}"
        fi

    - name: Install Flutter SDK (via FVM)
      shell: bash
      working-directory: Flutter/budgetit
      run: fvm install

    - name: Configure PATH
      shell: bash
      working-directory: Flutter/budgetit
      run: echo "$(pwd)/.fvm/flutter_sdk/bin" >> "${GITHUB_PATH}"

    - name: Cache pub dependencies
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8
      with:
        path: ~/.pub-cache
        key: pub-cache-${{ runner.os }}-${{ hashFiles('Flutter/budgetit/pubspec.lock') }}
        restore-keys: |
          pub-cache-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: Flutter/budgetit
      run: flutter pub get --enforce-lockfile
